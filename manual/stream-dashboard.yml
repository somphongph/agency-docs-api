info:
  name: Stream Dashboard (SSE)
  type: http
  seq: 3

http:
  method: GET
  url: "{{endpoint}}/api/v1/dashboard/stream"
  headers:
    - name: Accept
      value: text/event-stream

docs: |-
  Live updates over Server-Sent Events. The connection never ends on its own, so this request is
  for the Bruno **app** only — it lives in `manual/` so automated runs never touch it.

  - Bruno CLI 4.3.0 does **not** skip SSE requests (it keeps reading the stream and the run
    hangs), so CI runs the finite requests with `bru run dashboard`.
  - No assertion script on purpose: there is no "response complete" moment to run one against.

  ## What you should see

  ```
  event:dashboard
  data:{"success":true,"type":"success","message":"Successful.","data":{ ... }}

  :ping                      <- heartbeat comment every 20s
  ```

  The first `event:dashboard` arrives immediately (current snapshot). Run
  `Refresh Dashboard` in another tab — or press the **New data** button in the web UI — and a new
  `event:dashboard` is appended to the same stream within a moment.

  Press **Cancel** in Bruno to close the stream.

  Same thing from a terminal when you need it in CI:

  ```bash
  curl -N -H 'Accept: text/event-stream' http://localhost:8080/api/v1/dashboard/stream
  ```
